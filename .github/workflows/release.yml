name: Release

# Push a tag like v1.0.0 to build the Windows installer + portable zip and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the v), e.g. 1.0.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: v
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Check app version matches tag
        shell: pwsh
        run: |
          $line = Select-String -Path src\session_deck.py -Pattern '^VERSION = "(.+)"' | Select-Object -First 1
          if ($line.Matches[0].Groups[1].Value -ne "${{ steps.v.outputs.version }}") { throw "VERSION in src/session_deck.py does not match the tag" }

      - name: Build app (PyInstaller)
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name SessionDeck
          --icon assets\logo.ico
          --add-data "src\ui.html;."
          --add-data "assets;assets"
          --paths src --hidden-import demo_data
          src\session_deck.py

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\SessionDeck\SessionDeck.exe -ArgumentList "--demo","--no-window" -PassThru
          Start-Sleep -Seconds 8
          $info = Get-Content "$env:LOCALAPPDATA\SessionDeck\demo\server.json" | ConvertFrom-Json
          $r = Invoke-RestMethod -Uri "http://127.0.0.1:$($info.port)/api/sessions" -Headers @{ "X-Token" = $info.token }
          Stop-Process -Id $p.Id -Force
          if ($r.sessions.Count -ne 12) { throw "expected 12 demo sessions, got $($r.sessions.Count)" }
          Write-Host "Built app served $($r.sessions.Count) demo sessions"

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\SessionDeck\* -DestinationPath "dist\SessionDeck-${{ steps.v.outputs.version }}-portable.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" installer\SessionDeck.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          gh release create "v$v" `
            "dist\SessionDeck-Setup-$v.exe" "dist\SessionDeck-$v-portable.zip" "dist\SHA256SUMS.txt" `
            --title "Session Deck $v" --notes-file RELEASE_NOTES.md
